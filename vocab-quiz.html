.opt.ok{background:rgba(16,185,129,.18);border-color:var(--ok)}.opt.no{background:rgba(232,79,107,.18);border-color:var(--no)}.opt.dim{opacity:.4}

.go.red{background:var(--no)}.go.ghost{background:none;border:1px solid var(--bd);color:var(--mut)}

.fb{margin:10px 0;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.wl div{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.wl b{min-width:42%}

.section-label{font-size:14px;font-weight:700;margin:18px 0 8px}
.session-note{background:rgba(74,108,247,.1);border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
.hint{margin-top:14px;line-height:1.7}
.q .w{overflow-wrap:anywhere;line-height:1.4}
.opt{font-weight:600;font-size:16px;line-height:1.5;min-height:72px}
.opt-letter{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
button:disabled{cursor:default}.big:disabled{opacity:.5}
.opt:disabled{color:var(--tx);opacity:1}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.answer-line{margin:8px 0;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.learn{margin-top:14px;padding:16px;text-align:left}.learn .section-label{margin-top:0}
.learn-row{border-top:1px solid var(--bd);padding:12px 0;line-height:1.7;overflow-wrap:anywhere}
.learn-row:last-child{padding-bottom:0}.learn-heading{display:flex;gap:8px;align-items:baseline}
.badge{font-size:12px;flex-shrink:0;color:var(--mut)}
.learn-row.correct .learn-heading b{color:var(--ok)}
.target{background:rgba(74,108,247,.07);border-radius:10px;padding:10px;border:0;margin-bottom:8px}
.review-item{border-top:1px solid var(--bd);padding:12px 0}.review-item summary{cursor:pointer;font-weight:600;line-height:1.7;overflow-wrap:anywhere}
.review-item summary .mut{display:block;margin-left:20px;font-weight:400}.review-item .learn{margin-bottom:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:360px){body{padding:10px}.card{padding:16px}.q .w{font-size:24px}.chip{padding:7px 11px}}

.flash-card{display:block;width:100%;min-height:300px;margin-top:20px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;touch-action:manipulation}
.flash-word{display:block;font-size:32px;font-weight:800;line-height:1.4;overflow-wrap:anywhere;margin:12px 0 24px}
.flash-meaning{display:block;font-size:26px;font-weight:700;color:var(--ac);margin-bottom:10px}
.flash-pos{display:block;color:var(--mut);font-size:14px}
.flash-other{display:block;color:var(--mut);font-size:14px;line-height:1.8;margin-top:14px}
.flash-hint{display:block;color:var(--mut);font-size:15px;margin-top:34px}
.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.flash-actions .go{min-height:58px;margin:0;touch-action:manipulation}.go.green{background:#07895e}
.flash-stats{text-align:center;font-size:14px;color:var(--mut);margin:14px 0}

  ${flashRevealed?`<span class="flash-meaning">${esc(w.zh)}</span><span class="flash-pos">${esc(posText(w))}</span><span class="flash-other">${esc(w.aliases.slice(1).join('／'))}</span>`:'<span class="flash-hint">點卡片翻開答案</span>'}</button>
  ${flashRevealed?`<div class="flash-actions"><button class="go red" onclick="gradeFlash(false,${i})">✗ 答錯／還不熟</button><button class="go green" id="flash-correct" onclick="gradeFlash(true,${i})">✓ 答對／記得了</button></div>`:'<button class="go" id="flash-reveal" onclick="flipFlash()">翻開答案</button>'}
  <div class="flash-stats" aria-live="polite">已答對 ${known}・答錯 ${missed}・剩下 ${qs.length-i}</div><div class="mut" style="text-align:center">${flashRevealed?'按對錯後直接下一張；答錯會加入弱項':'先回想，再翻開答案'}<br>電腦快捷鍵：空白鍵翻卡・← 答錯・→ 答對</div>`;
  const focus=document.getElementById(flashRevealed?'flash-correct':'flash-reveal');if(focus)focus.focus({preventScroll:true});
}
function flipFlash(){
  if(mode!=='flash'||!flashActive||flashRevealed||done)return;
  flashRevealed=true;renderFlash();
}
function gradeFlash(ok,questionIndex){
  if(mode!=='flash'||!flashActive||!flashRevealed||done||questionIndex!==i)return;
  done=true;answeredValue=ok?'答對':'答錯';record(ok,'flash');next();
}
document.addEventListener('keydown',event=>{
  if(mode!=='flash'||!flashActive||event.repeat||event.isComposing||event.ctrlKey||event.metaKey||event.altKey)return;
  if(['INPUT','TEXTAREA','SELECT'].includes(event.target?.tagName))return;
  if(event.code==='Space'){event.preventDefault();flipFlash()}
  else if(flashRevealed&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();gradeFlash(event.key==='ArrowRight',i)}
});
function record(ok,kind){
  const w=qs[i];res.push({w,ok,kind,value:answeredValue,options:[...currentOptions]});let wk=weak();
  if(ok){streak++;best=Math.max(best,streak);if(kind!=='typo')wk=wk.filter(x=>x!==w.en)}else{streak=0;if(!wk.includes(w.en))wk.push(w.en)}
  if(kind==='typo'&&!wk.includes(w.en))wk.push(w.en);
  setWeak(wk);document.getElementById('streak').textContent='🔥 '+streak;
}
function nextBtn(){return `<button class="go" id="next-button" onclick="next()">${i+1>=qs.length?'查看結果':'下一題'} →</button>`}
function wordRow(w,label,cls=''){
  return `<div class="learn-row ${cls}"><div class="learn-heading">${label?`<span class="badge">${label}</span>`:''}<b>${esc(w.en)}</b></div><div>${esc(w.zh)}</div><div class="mut">${esc(posText(w))}</div></div>`;
}
function learningPanel(w,options,value){
  return `<div class="card learn"><div class="section-label">${options.length?'題目與所有選項':'單字記憶'}</div>${wordRow(w,'題目','target')}
  ${options.length?options.map((x,k)=>wordRow(x,`${String.fromCharCode(65+k)}${x.en===w.en?' ✓':x.en===value?' ← 你的答案':''}`,x.en===w.en?'correct':'')).join(''):`<div class="mut hint">可接受的意思：${esc([...new Set(w.aliases)].join('／'))}</div>`}</div>`;
}
function feedback(result){
  const w=qs[i];done=true;record(result.ok,result.kind);
  const input=document.getElementById('answer-input');if(input)input.disabled=true;
  const act=document.getElementById('act');if(act)act.remove();
  let message=result.ok?'✓ 答對了！':'✗ 答錯了';
  if(result.kind==='typo')message='≈ 有 1 處拼字誤植，容錯算對；已加入弱項';
  if(result.kind==='format')message='✓ 答對了！已忽略標點或格式差異';
  document.getElementById('fb').innerHTML=`<div class="fb ${result.ok?'ok':'no'}">${message}</div>
  ${input?`<div class="answer-line">你的答案：${esc(answeredValue)}</div>`:''}<div class="answer-line">標準答案：<b>${esc(w.en)}</b> — ${esc(w.zh)}</div>
  ${mode==='type'&&!result.ok?'<div class="mut hint">未符合內建同義答案。可接受的寫法列在下方。</div>':''}${nextBtn()}${learningPanel(w,currentOptions,answeredValue)}`;
  document.getElementById('next-button').focus({preventScroll:true});
}
function pick(k){
  if(done||!currentOptions[k])return;
  const w=qs[i];answeredValue=currentOptions[k].en;
  document.querySelectorAll('.opt').forEach(x=>{
    const option=currentOptions[Number(x.dataset.option)];x.disabled=true;
    if(option.en===w.en)x.classList.add('ok');else if(Number(x.dataset.option)===k)x.classList.add('no');
  });feedback({ok:answeredValue===w.en,kind:'choice'});
}
function submitInput(event){
  const input=document.getElementById('answer-input');if(done||!input||input.dataset.composing==='1'||event?.isComposing)return;
  answeredValue=input.value.trim();if(!answeredValue){input.focus();return}
  if(mode==='spell')feedback(gradeSpelling(answeredValue,qs[i]));
}
function next(){if(!done)return;if(i+1>=qs.length)summary();else{i++;quiz()}}
function toggleReview(){const items=[...document.querySelectorAll('.review-item')];const open=items.some(d=>!d.open);items.forEach(d=>d.open=open);document.getElementById('toggle-review').textContent=open?'收合全部詳解':'展開全部詳解'}
function summary(){
  flashActive=false;
  const c=res.filter(r=>r.ok).length,t=res.length,wr=res.filter(r=>!r.ok),p=Math.round(c/t*100),typos=res.filter(r=>r.kind==='typo');
  $.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:52px">${p===100?'🏆':p>=80?'🌟':p>=60?'👍':'💪'}</div><h1>${mode==='flash'?'複習完成':'測驗結束'}</h1>
  <p>答對 <b>${c}</b>・答錯 <b>${wr.length}</b>・最高連勝 <b>${best}</b></p><div class="bar"><i style="width:${p}%"></i></div><div class="mut">${p}% 正確率${typos.length?`（含 ${typos.length} 題拼字容錯）`:''}</div>
  <button class="go" onclick="start(mode,qs)">🔄 再練一次</button>
  ${wr.length?`<button class="go red" onclick="start(mode,res.filter(r=>!r.ok).map(r=>r.w))">❌ 只複習錯的（${wr.length}）</button>`:''}
  ${typos.length?`<button class="go" onclick="start('spell',res.filter(r=>r.kind==='typo').map(r=>r.w))">✍️ 修正拼字（${typos.length}）</button>`:''}
  <button class="go ghost" onclick="home()">🏠 回首頁</button></div>
  <div class="card"><div class="top"><b>全部題目詳解 (${t})</b><button class="chip" id="toggle-review" onclick="toggleReview()">展開全部詳解</button></div>
  ${res.map((r,k)=>`<details class="review-item" ${r.ok&&r.kind!=='typo'?'':'open'}><summary>${r.ok?r.kind==='typo'?'≈':'✓':'✗'} ${k+1}. ${esc(r.w.en)}<span class="mut">${esc(r.w.zh)}</span></summary><div class="answer-line">${r.kind==='flash'?'自評結果':'你的答案'}：${esc(r.value)}${r.kind==='typo'?'（拼字容錯）':''}</div>${learningPanel(r.w,r.options,r.value)}</details>`).join('')}</div>`;
  window.scrollTo(0,0);
}
home();

</script></body></html>
